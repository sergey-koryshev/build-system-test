name: Create Node Workspaces 1 Version Label

concurrency: versioning

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'node/workspaces/src/test-workspace-1/**'

jobs:
  create_label:
    name: Create Version Label
    uses: sergey-koryshev/build-system/.github/workflows/create-version-label.yml@88d35dd506e4bc7cfa51a59ed04b4b922ff08c5e
    secrets:
      REPO_TOKEN: ${{ secrets.REPO_PAT }}
    with:
      project-type: Node
      root-path: node/workspaces
      workspace-name: test-workspace-1
      version-configuration-path: version-configuration.json
      scripts-ref: 88d35dd506e4bc7cfa51a59ed04b4b922ff08c5e
