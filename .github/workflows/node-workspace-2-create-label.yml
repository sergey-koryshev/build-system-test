name: Create Node Workspaces 2 Version Label

concurrency: versioning

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'node/workspaces/src/test-workspace-2/**'

jobs:
  create_label:
    name: Create Version Label
    uses: sergey-koryshev/build-system/.github/workflows/create-version-label.yml@e61f85c9468c5337a433ccd5de13661c90340079
    secrets:
      REPO_TOKEN: ${{ secrets.REPO_PAT }}
    with:
      app-name: test-workspace-2
      project-type: Node
      root-path: node/workspaces
      workspace-name: test-workspace-2
      version-configuration-path: version-configuration.json
      scripts-ref: e61f85c9468c5337a433ccd5de13661c90340079
